[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kenia-intent-engine"
version = "0.2.0"
description = "Motor conversacional ligero con clasificación de intenciones y contexto"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Project contributors"}]
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "scikit-learn>=1.6,<2"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Natural Language :: Spanish",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
kenia-chat = "kenia_assistant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kenia_assistant = ["resources/*.joblib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
